# Checks the Rust workspace on every pull request, and every push to main:
# formatting, lints and tests, on macOS and Windows.
name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # One platform failing shouldn't hide how the other did.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The patched GPUI (third_party/gpui/PATCHES.md) on a real renderer:
      # backdrop blur, transforms, group opacity, hit testing through a
      # rotation and a window capture. On Windows the release build compiles
      # the HLSL with fxc, and the window draws through DirectX 11 on the
      # runner's adapter (WARP when there is no GPU). Informational until it
      # has been seen green on both runners.
      - name: Effects example
        run: cargo run -p nodus-ui --example effects --release
        continue-on-error: true
        env:
          EFFECTS_SECONDS: "4"
          EFFECTS_STRICT: "1"
