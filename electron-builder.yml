# Packages the electron-vite build in out/ for the platform it runs on: `pnpm dist`.
# On a Mac that's the DMGs (arm64 + x64), on Windows the installers (x64 + arm64).
appId: dev.saleem.nodus
productName: Nodus
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# node-pty and uiohook-napi ship N-API prebuilds, so there's nothing to rebuild for Electron.
npmRebuild: false
# spawn-helper has to be a real file on disk for node-pty to exec it, and the
# key hook behind floating capture loads its native addon from disk too.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/uiohook-napi/**
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  # No version in the name, so releases/latest/download/<name> links stay stable.
  artifactName: Nodus-${arch}.${ext}
  category: public.app-category.developer-tools
  # Signed with the Developer ID certificate in the keychain (CI installs it first) and
  # notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Shown when the mic button first asks for the microphone, and when floating
  # capture first reads the browser tab in front.
  extendInfo:
    NSMicrophoneUsageDescription: Nodus listens only while you record with the mic button, to turn what you say into a prompt.
    NSAppleEventsUsageDescription: Floating capture reads the link and title of the browser tab in front, to send along with what you write.
dmg:
  # No auto-updater, so skip the .blockmap files.
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # The Mac icon less its margin, which Windows doesn't leave around icons.
  icon: build/icon-win.png
  # Not code signed yet, so SmartScreen asks before the first run (More info › Run anyway).
nsis:
  # Installs for this user only, with no admin prompt, and opens Nodus when done.
  # The updater runs it again with /S --force-run.
  oneClick: true
  perMachine: false
  artifactName: Nodus-Setup-${arch}.${ext}
  shortcutName: Nodus
  # The updater fetches the whole installer, as the DMG, so skip the .blockmap.
  differentialPackage: false
  # Uninstalling leaves the boards and settings in %APPDATA%\Nodus.
  deleteAppDataOnUninstall: false
