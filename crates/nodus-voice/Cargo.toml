[package]
name = "nodus-voice"
description = "Voice prompts: speech to text through xAI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nodus-domain.workspace = true
nodus-git.workspace = true
nodus-platform.workspace = true
nodus-store.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["multipart", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["multipart", "native-tls"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "test-util"] }

