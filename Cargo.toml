# Nodus: one crate per domain (docs/how-it-works.md, Project layout). It
# replaced the Electron app of 0.9.4; doc comments that say a module ports
# `src/…` mean that app's sources at tag v0.9.4. Behaviors, their IDs and the
# decisions comments cite (D1…D13, U1): docs/specs/.
[workspace]
members = ["crates/*"]
# The patched GPUI under third_party/ builds as a dependency, not a member,
# so it keeps upstream's formatting and lints (third_party/gpui/PATCHES.md).
exclude = ["third_party"]
resolver = "3"

[workspace.package]
version = "1.0.12"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Saleem Hadad"]
repository = "https://github.com/saleem-hadad/nodus"
publish = false

[workspace.dependencies]
nodus-actions = { path = "crates/nodus-actions" }
nodus-board = { path = "crates/nodus-board" }
nodus-capture = { path = "crates/nodus-capture" }
nodus-core = { path = "crates/nodus-core" }
nodus-domain = { path = "crates/nodus-domain" }
nodus-feedback = { path = "crates/nodus-feedback" }
nodus-git = { path = "crates/nodus-git" }
nodus-host = { path = "crates/nodus-host" }
nodus-host-proto = { path = "crates/nodus-host-proto" }
nodus-platform = { path = "crates/nodus-platform" }
nodus-sessions = { path = "crates/nodus-sessions" }
nodus-store = { path = "crates/nodus-store" }
nodus-terminal = { path = "crates/nodus-terminal" }
nodus-tools = { path = "crates/nodus-tools" }
nodus-transcripts = { path = "crates/nodus-transcripts" }
nodus-ui = { path = "crates/nodus-ui" }
nodus-updater = { path = "crates/nodus-updater" }
nodus-views = { path = "crates/nodus-views" }
nodus-voice = { path = "crates/nodus-voice" }
nodus-wire = { path = "crates/nodus-wire" }

# The terminal grid and VT parser (decision D2); exact, since nodus-terminal
# reaches into its grid to keep xterm.js's character widths.
alacritty_terminal = { version = "=0.26.0", default-features = false }
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1.0.104"
block2 = "0.6"
cbc = { version = "0.1", features = ["alloc"] }
dispatch2 = "0.3"
# Streams and sinks, for the server's WebSocket and its client.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# GPUI, gpui-component and their assets behind one facade (D1). Its GPUI is
# the patched one under [patch.crates-io].
gpui-kit = "=0.9.0"
libc = "0.2"
# Apple's frameworks; crates pick the classes they use.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std"] }
pbkdf2 = "0.12"
# HTTP for GitHub releases and xAI. Crates pick the TLS: rustls (webpki roots,
# as Node bundles its own) on macOS; Windows' own TLS there, since ring can't
# be cross-checked for Windows from a Mac.
reqwest = { version = "0.12", default-features = false }
security-framework = "3"
sha1 = "0.10"
sha2 = "0.10"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# ICU collation, for sorting as JavaScript's localeCompare does.
icu_collator = "2.4"
# PNG files, for window captures. GPUI already depends on it.
image = { version = "0.25", default-features = false, features = ["png"] }
# The folder drawings and Settings previews (nodus-ui): gradients and shadows
# GPUI's single-colour svg() can't draw.
raw-window-handle = "0.6.2"
resvg = { version = "0.46.0", default-features = false }
# Round caps and joins for the board's ink (GPUI tessellates paths with lyon).
lyon = "1.0"
indexmap = { version = "2.14", features = ["serde"] }
# Watches transcript folders (FSEvents on macOS, ReadDirectoryChangesW on Windows).
notify = "8.2"
# The microphone through Core Audio's voice-processing unit.
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std"] }
# Opus in pure Rust (a port of libopus 1.6), so voice prompts are encoded as
# Chromium's MediaRecorder encodes them, with nothing to compile for Windows.
opus1 = "0.3"
regex = "1.13"
rustix = { version = "1.1", features = ["fs"] }
# The shortest digits for a number, breaking ties to even as JavaScript does.
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
# Keeps objects' keys in the order they were read, as JavaScript does, and
# reads every number exactly, so state.json is written back the way it was found.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
# A server's WebSocket (SRV-023), upgraded from hyper on the server's side.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
# Line breaks and graphemes as Chromium finds them (UAX #14, #29), for the
# board's wrapped and clamped text. gpui-component already depends on both.
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
# The widths alacritty_terminal gives characters (the same crate it uses).
unicode-width = "0.2"
# WHATWG URL parsing, as `new URL()` does.
url = "2.5"
uuid = { version = "1.29", features = ["serde", "v4"] }
# Windows APIs without WinRT: job objects, DPAPI, the shell. Crates pick features.
windows-sys = "0.61"
# WinRT, for toasts; COM, for WASAPI capture.
windows = { version = "0.62", default-features = false, features = ["std"] }
# Views' pages in the system webview, WKWebView or WebView2 (decision D3).
wry = { version = "=0.57.1", default-features = false }

# Our patched GPUI (D13): the gpui-pre crates we change, vendored with their
# names and version kept, so gpui-kit and gpui-component resolve to them and
# the graph holds one GPUI. What each patch does: third_party/gpui/PATCHES.md.
[patch.crates-io]
gpui-pre = { path = "third_party/gpui/gpui-pre" }
gpui-pre-apple = { path = "third_party/gpui/gpui-pre-apple" }
gpui-pre-macos = { path = "third_party/gpui/gpui-pre-macos" }
gpui-pre-wgpu = { path = "third_party/gpui/gpui-pre-wgpu" }
gpui-pre-windows = { path = "third_party/gpui/gpui-pre-windows" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
