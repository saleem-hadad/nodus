# Packages the electron-vite build in out/ into macOS DMGs (arm64 + x64): `pnpm dist`.
appId: dev.saleem.nodus
productName: Nodus
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# node-pty ships N-API prebuilds, so there's nothing to rebuild for Electron.
npmRebuild: false
# spawn-helper has to be a real file on disk for node-pty to exec it.
asarUnpack:
  - node_modules/node-pty/**
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  # No version in the name, so releases/latest/download/<name> links stay stable.
  artifactName: Nodus-${arch}.${ext}
  category: public.app-category.developer-tools
  # Signed with the Developer ID certificate in the keychain (CI installs it first) and
  # notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID are set.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Shown when the mic button first asks for the microphone.
  extendInfo:
    NSMicrophoneUsageDescription: Nodus listens only while you record with the mic button, to turn what you say into a prompt.
dmg:
  # No auto-updater, so skip the .blockmap files.
  writeUpdateInfo: false
