[package]
name = "nodus-tools"
description = "The board tools: the MCP server Claude sessions use to work with their board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
nodus-board.workspace = true
nodus-domain.workspace = true
nodus-sessions.workspace = true
nodus-store.workspace = true
nodus-visual.workspace = true
# Draws the board as a picture for look_at_board (TOOL-111): its text in
# the system's fonts, and the pictures on it.
resvg = { workspace = true, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
serde_json.workspace = true

[dev-dependencies]
nodus-host-proto.workspace = true
nodus-transcripts.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
