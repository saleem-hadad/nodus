# Typechecks, tests and builds every pull request, and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Builds and installs the Windows app, then drives it (scripts/smoke.mjs).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The suites that cover Windows. Most others start POSIX shells.
      - run: pnpm exec vitest run src/main/hostProtocol.test.ts src/main/hooks.test.ts src/main/env.test.ts src/renderer/src/platform.test.ts
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis --x64 --publish never

      # Installs it the way a user would, silently, into %LOCALAPPDATA%\Programs.
      - name: Install
        shell: pwsh
        run: Start-Process -Wait -FilePath dist/Nodus-Setup-x64.exe -ArgumentList '/S'

      - run: node scripts/smoke.mjs "$LOCALAPPDATA/Programs/nodus/Nodus.exe" smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows
          path: |
            smoke
            dist/Nodus-Setup-x64.exe
          if-no-files-found: ignore
