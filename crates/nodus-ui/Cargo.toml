[package]
name = "nodus-ui"
description = "The native UI: theme, components, and every screen of the app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
gpui-kit.workspace = true
image.workspace = true
indexmap.workspace = true
nodus-board.workspace = true
nodus-core.workspace = true
nodus-domain.workspace = true
nodus-feedback.workspace = true
nodus-platform.workspace = true
nodus-sessions.workspace = true
nodus-terminal.workspace = true
nodus-transcripts.workspace = true
# The capture panel's mic (07 CAP-103): 05's voice controller.
nodus-voice.workspace = true
resvg.workspace = true
# Local time, as `Intl.DateTimeFormat` shows it (localtime_r / localtime_s).
libc.workspace = true
lyon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
# Spec 05's UI: the rail's and dialog's logic, the git labels and diff parser
# (the mics' controller is nodus-voice, above).
nodus-actions.workspace = true
nodus-git.workspace = true
uuid.workspace = true
# Views' pages (spec 04): a child webview per frame.
wry.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSAlert", "NSAppearance", "NSApplication", "NSButton", "NSControl", "NSColor", "NSEvent", "NSGraphics", "NSMenu", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSGeometry", "NSProcessInfo", "NSString", "NSURL"] }
# Views' page snapshots, redrawn in sRGB (spec 04).
objc2-core-foundation = { workspace = true, features = ["CFAttributedString", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
# Views' ink over live pages: labels set in the system font (spec 04, D3).
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "CTFontTraits", "CTLine", "CTStringAttributes", "objc2-core-graphics"] }
raw-window-handle.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Runs on the main thread, as the Mac platform's text system needs.
[[test]]
name = "text_parity"
harness = false

[lints]
workspace = true
