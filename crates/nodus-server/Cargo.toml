[package]
name = "nodus-server"
description = "Nodus on a server: the core with no window, served over one WebSocket, and the session host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# `nodus-server`, since the app's crate builds `nodus`; the install script
# puts it on a server as `/opt/nodus/bin/nodus` (SRV-001).
[[bin]]
name = "nodus-server"
path = "src/main.rs"

[dependencies]
base64.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
indexmap.workspace = true
nodus-core.workspace = true
nodus-domain.workspace = true
nodus-host.workspace = true
nodus-host-proto.workspace = true
nodus-platform.workspace = true
nodus-updater.workspace = true
nodus-wire = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "net", "process", "signal"] }
tokio-tungstenite.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# GitHub's API (SRV-041, SRV-062), the App's RS256 key, and the ed25519
# signature on an update (SRV-200). A server runs on Linux; on Windows it
# builds without them, as the other crates' TLS does.
[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls"] }
ring.workspace = true

[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
nodus-remote.workspace = true
nodus-transcripts.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
