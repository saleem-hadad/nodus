# Checks every pull request, and every push to main: formatting, lints and
# tests of the Cargo workspace, on macOS and Windows, and lints and tests of
# the core (everything but the GPUI app) on Linux. Packaging is checked by
# package.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # One platform failing shouldn't hide how the other did.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The toolchain rust-toolchain.toml pins, with rustfmt and clippy.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The patched GPUI (third_party/gpui/PATCHES.md) on a real renderer:
      # backdrop blur, transforms, group opacity, hit testing through a
      # rotation and a window capture. On Windows the release build compiles
      # the HLSL with fxc, and the window draws through DirectX 11 on the
      # runner's adapter (WARP when there is no GPU). It runs whatever the
      # tests did, so a failing test doesn't hide the shaders. Required on
      # macOS, where it has passed; informational on Windows until it has been
      # seen green there (every shader compiles with DXC, but fxc and WARP
      # haven't run them yet).
      - name: Effects example
        if: ${{ !cancelled() }}
        run: cargo run -p nodus-ui --example effects --release
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          EFFECTS_SECONDS: "4"
          EFFECTS_STRICT: "1"

  # The core on Linux, where a headless server runs it: every crate but the
  # app's UI and binary, which ship only for macOS and Windows. The tests
  # include nodus-core's headless.rs, the whole core with a real session host.
  # Nothing to install: ring's C builds with the runner's gcc, and the tests
  # need only git, sh and the usual tools, which the runner has.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo clippy --workspace --exclude nodus-ui --exclude nodus --all-targets -- -D warnings
      - run: cargo test --workspace --exclude nodus-ui --exclude nodus
